<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #000000; }
      .nav { font: 500 28px Arial, sans-serif; fill: #f5f5f5; }
      .logo-text { font: 700 16px Arial, sans-serif; fill: #04140f; }
      .role { font: 700 17px Arial, sans-serif; }
      .role-small { font: 700 15px Arial, sans-serif; }
      .cell { font: 500 18px Arial, sans-serif; }
      .legend { font: 700 17px Arial, sans-serif; fill: #f4f4f5; }
      .hint { font: 500 15px Arial, sans-serif; fill: #a3a3a3; }

      .red-box { fill: #431518; stroke: #ff4d57; stroke-width: 3; }
      .red-text { fill: #ff5c66; }
      .red-soft { fill: #823130; stroke: #ff8b8b; stroke-width: 2; }
      .red-soft-text { fill: #f0b5b5; }

      .green-box { fill: #063f33; stroke: #20b486; stroke-width: 2; }
      .green-text { fill: #72cdb3; }
      .green-chip { fill: #16a37a; }

      .gray-box { fill: #55534d; stroke: #d4d4d4; stroke-width: 1.5; }
      .gray-text { fill: #d4d4d4; }
      .gray-chip { fill: #d4d4d4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" class="bg" />

  <!-- Top navigation / use-map columns -->
  <rect x="28" y="20" width="82" height="44" rx="8" ry="8" class="green-chip" />
  <text x="69" y="49" text-anchor="middle" class="logo-text">MVP</text>

  <text x="172" y="51" class="nav">Регистрация</text>
  <text x="468" y="51" class="nav">Справочники</text>
  <text x="755" y="51" class="nav">Приход</text>
  <text x="1034" y="51" class="nav">Отчеты</text>
  <text x="1310" y="51" class="nav">Авт. / Выход</text>

  <!-- Role labels -->
  <rect x="18" y="92" width="136" height="86" rx="9" ry="9" class="red-box" />
  <text x="86" y="128" text-anchor="middle" class="role-small red-text">Новый</text>
  <text x="86" y="155" text-anchor="middle" class="role-small red-text">сотрудник</text>

  <rect x="18" y="415" width="136" height="86" rx="9" ry="9" class="green-box" />
  <text x="86" y="452" text-anchor="middle" class="role-small green-text">Сотр.</text>
  <text x="86" y="479" text-anchor="middle" class="role-small green-text">склада</text>

  <!-- Guest row -->
  <rect x="190" y="82" width="160" height="66" rx="8" ry="8" class="red-soft" />
  <text x="270" y="122" text-anchor="middle" class="cell red-soft-text">Регистрация</text>
  <rect x="340" y="139" width="20" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1300" y="82" width="240" height="66" rx="8" ry="8" class="red-soft" />
  <text x="1420" y="122" text-anchor="middle" class="cell red-soft-text">Вход по email</text>
  <rect x="1530" y="139" width="20" height="14" rx="2" ry="2" class="green-chip" />

  <!-- Employee / warehouse row: directories -->
  <rect x="452" y="222" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="562" y="262" text-anchor="middle" class="cell green-text">Поиск материалов</text>
  <rect x="662" y="279" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="452" y="304" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="562" y="344" text-anchor="middle" class="cell green-text">Фильтрация</text>
  <rect x="662" y="361" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="452" y="386" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="562" y="426" text-anchor="middle" class="cell green-text">Карточка материала</text>
  <rect x="662" y="443" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="452" y="468" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="562" y="508" text-anchor="middle" class="cell green-text">Поставщики</text>
  <rect x="662" y="525" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <!-- Employee / warehouse row: receipts -->
  <rect x="742" y="222" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="852" y="262" text-anchor="middle" class="cell green-text">Добавить приход</text>
  <rect x="952" y="279" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="742" y="304" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="852" y="344" text-anchor="middle" class="cell green-text">Список прихода</text>
  <rect x="952" y="361" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="742" y="386" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="852" y="426" text-anchor="middle" class="cell green-text">Поиск прихода</text>
  <rect x="952" y="443" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="742" y="468" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="852" y="508" text-anchor="middle" class="cell green-text">Расчет суммы</text>
  <rect x="952" y="525" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <!-- Employee / warehouse row: reports -->
  <rect x="1030" y="222" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="1140" y="262" text-anchor="middle" class="cell green-text">Сводка склада</text>
  <rect x="1240" y="279" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1030" y="304" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="1140" y="344" text-anchor="middle" class="cell green-text">Поставщ. материала</text>
  <rect x="1240" y="361" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1030" y="386" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="1140" y="426" text-anchor="middle" class="cell green-text">Кол-во поставщ.</text>
  <rect x="1240" y="443" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1030" y="468" width="220" height="66" rx="8" ry="8" class="green-box" />
  <text x="1140" y="508" text-anchor="middle" class="cell green-text">Адрес банка</text>
  <rect x="1240" y="525" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <!-- Employee / warehouse row: auth / view -->
  <rect x="1300" y="222" width="240" height="66" rx="8" ry="8" class="green-box" />
  <text x="1420" y="262" text-anchor="middle" class="cell green-text">Выход из акк.</text>
  <rect x="1530" y="279" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1300" y="304" width="240" height="66" rx="8" ry="8" class="green-box" />
  <text x="1420" y="344" text-anchor="middle" class="cell green-text">Темная тема</text>
  <rect x="1530" y="361" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <rect x="1300" y="386" width="240" height="66" rx="8" ry="8" class="green-box" />
  <text x="1420" y="426" text-anchor="middle" class="cell green-text">Сохранить токен</text>
  <rect x="1530" y="443" width="18" height="14" rx="2" ry="2" class="green-chip" />

  <!-- Non-MVP / service row -->
  <rect x="190" y="932" width="220" height="66" rx="8" ry="8" class="gray-box" />
  <text x="300" y="972" text-anchor="middle" class="cell gray-text">Подтвержд. почты</text>

  <rect x="452" y="932" width="220" height="66" rx="8" ry="8" class="gray-box" />
  <text x="562" y="972" text-anchor="middle" class="cell gray-text">Импорт справочн.</text>

  <rect x="742" y="932" width="220" height="66" rx="8" ry="8" class="gray-box" />
  <text x="852" y="972" text-anchor="middle" class="cell gray-text">Инвентаризация</text>

  <rect x="1030" y="932" width="220" height="66" rx="8" ry="8" class="gray-box" />
  <text x="1140" y="972" text-anchor="middle" class="cell gray-text">Печать отчетов</text>

  <rect x="1300" y="932" width="240" height="66" rx="8" ry="8" class="gray-box" />
  <text x="1420" y="972" text-anchor="middle" class="cell gray-text">OAuth / SSO</text>

  <!-- Legend -->
  <rect x="190" y="1040" width="22" height="22" rx="4" ry="4" class="green-chip" />
  <text x="230" y="1057" class="legend">= входит в MVP</text>

  <rect x="455" y="1040" width="22" height="22" rx="4" ry="4" fill="#ff8b8b" />
  <text x="495" y="1057" class="hint">новый сотрудник</text>

  <rect x="742" y="1040" width="22" height="22" rx="4" ry="4" class="green-chip" />
  <text x="782" y="1057" class="hint">сотрудник склада</text>

  <rect x="1300" y="1040" width="22" height="22" rx="4" ry="4" class="gray-chip" />
  <text x="1340" y="1057" class="hint">не входит в MVP</text>
</svg>
