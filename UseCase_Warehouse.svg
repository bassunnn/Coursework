<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #132238; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #132238; }
      .text { font: 15px Arial, sans-serif; fill: #132238; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .actor { stroke: #132238; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .system { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; rx: 18; }
      .usecase { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5; }
      .line { stroke: #334155; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bus { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .inherit { stroke: #132238; stroke-width: 2; fill: none; marker-end: url(#inheritance); stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="inheritance" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,6.5 L1,12 Z" fill="#ffffff" stroke="#132238" stroke-width="1.8" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff" />
  <text x="700" y="52" class="title" text-anchor="middle">Use Case: информационная система "Складской учет материалов"</text>

  <rect x="300" y="95" width="1010" height="760" class="system" />

  <!-- Actors -->
  <g transform="translate(105 205)">
    <circle cx="45" cy="28" r="24" class="actor" />
    <path d="M45 52 L45 118 M8 78 L82 78 M45 118 L12 168 M45 118 L78 168" class="actor" />
    <text x="45" y="205" class="subtitle" text-anchor="middle">Новый</text>
    <text x="45" y="228" class="subtitle" text-anchor="middle">сотрудник</text>
  </g>

  <g transform="translate(105 525)">
    <circle cx="45" cy="28" r="24" class="actor" />
    <path d="M45 52 L45 118 M8 78 L82 78 M45 118 L12 168 M45 118 L78 168" class="actor" />
    <text x="45" y="205" class="subtitle" text-anchor="middle">Сотрудник</text>
    <text x="45" y="228" class="subtitle" text-anchor="middle">склада</text>
  </g>

  <!-- Actor generalization -->
  <path d="M118 282 C101 310 90 343 82 380 C65 455 72 545 112 600" class="inherit" />

  <!-- Use cases: left column -->
  <ellipse cx="520" cy="170" rx="150" ry="42" class="usecase" />
  <text x="520" y="164" class="text" text-anchor="middle">Зарегистрироваться</text>
  <text x="520" y="185" class="text" text-anchor="middle">по коду приглашения</text>

  <ellipse cx="520" cy="285" rx="120" ry="40" class="usecase" />
  <text x="520" y="280" class="text" text-anchor="middle">Войти</text>
  <text x="520" y="301" class="text" text-anchor="middle">в систему</text>

  <ellipse cx="520" cy="400" rx="160" ry="42" class="usecase" />
  <text x="520" y="394" class="text" text-anchor="middle">Просмотреть сводные</text>
  <text x="520" y="415" class="text" text-anchor="middle">показатели склада</text>

  <ellipse cx="520" cy="515" rx="155" ry="42" class="usecase" />
  <text x="520" y="509" class="text" text-anchor="middle">Просмотреть и найти</text>
  <text x="520" y="530" class="text" text-anchor="middle">материалы</text>

  <ellipse cx="520" cy="630" rx="165" ry="42" class="usecase" />
  <text x="520" y="624" class="text" text-anchor="middle">Просмотреть и найти</text>
  <text x="520" y="645" class="text" text-anchor="middle">приходные записи</text>

  <ellipse cx="520" cy="745" rx="115" ry="38" class="usecase" />
  <text x="520" y="750" class="text" text-anchor="middle">Выйти из системы</text>

  <!-- Use cases: right column -->
  <ellipse cx="890" cy="225" rx="155" ry="45" class="usecase" />
  <text x="890" y="219" class="text" text-anchor="middle">Добавить единицу</text>
  <text x="890" y="240" class="text" text-anchor="middle">хранения</text>

  <ellipse cx="905" cy="455" rx="180" ry="48" class="usecase" />
  <text x="905" y="449" class="text" text-anchor="middle">Сформировать отчет</text>
  <text x="905" y="470" class="text" text-anchor="middle">по поставщикам материала</text>

  <ellipse cx="905" cy="685" rx="175" ry="48" class="usecase" />
  <text x="905" y="679" class="text" text-anchor="middle">Подсчитать поставщиков</text>
  <text x="905" y="700" class="text" text-anchor="middle">по адресу банка</text>

  <!-- Actor associations. Branches are routed through an outer bus, so they do not cross use-case ellipses. -->
  <path d="M190 285 L370 170" class="line" />

  <path d="M190 623 L265 623" class="line" />
  <path d="M265 225 L265 745" class="bus" />
  <path d="M265 225 L735 225" class="line" />
  <path d="M265 285 L400 285" class="line" />
  <path d="M265 400 L360 400" class="line" />
  <path d="M265 455 L725 455" class="line" />
  <path d="M265 515 L365 515" class="line" />
  <path d="M265 630 L355 630" class="line" />
  <path d="M265 685 L730 685" class="line" />
  <path d="M265 745 L405 745" class="line" />

  <text x="805" y="827" class="small" text-anchor="middle">Новый сотрудник связан с сотрудником склада отношением наследования; все складские операции выполняются после авторизации.</text>
</svg>
